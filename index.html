<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PMC 2026 프로젝트 빌런 소탕 작전</title>
<style>
:root{
  --bg:#070707; --card:#111; --line:#7d6128; --gold:#e6b64a;
  --text:#fff; --muted:#b9b9b9; --green:#18b76a; --panel:#171717;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{
  position:sticky;top:0;z-index:20;background:rgba(5,5,5,.96);
  border-bottom:1px solid #2a2a2a;padding:18px 22px;
}
header h1{margin:0;font-size:24px;color:var(--gold)}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
main{max-width:1400px;margin:0 auto;padding:24px}
.round{
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.25)
}
.round-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.round-title h2{margin:0;color:var(--gold);font-size:22px}
.round-title span{font-size:13px;color:var(--muted)}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.team-grid.two{grid-template-columns:repeat(2,1fr)}
.team-card{background:var(--panel);border:1px solid #2b2b2b;border-radius:18px;overflow:hidden}
.photo-wrap{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.team-body{padding:16px}
.team-name{font-size:20px;font-weight:800;margin-bottom:12px}
.score-row{display:flex;align-items:center;gap:10px}
.score-row label{color:var(--muted);font-size:14px}
.score-row input{
  width:110px;background:#0a0a0a;color:#fff;border:1px solid #444;border-radius:12px;
  padding:11px 12px;font-size:18px;font-weight:700
}
.score-row input:focus{outline:2px solid var(--gold);border-color:transparent}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}
button{
  border:none;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer
}
button.primary{background:var(--green);color:#fff}
button.secondary{background:#252525;color:#fff;border:1px solid #3a3a3a}
button:disabled{opacity:.45;cursor:not-allowed}
.summary{
  background:#0f0f0f;border:1px solid #2b2b2b;border-radius:18px;padding:18px;margin-top:12px
}
.summary h3{margin:0 0 14px;color:var(--gold)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 8px;border-bottom:1px solid #262626;text-align:left}
th{color:#aeb6bf;font-size:13px}
.rank{font-weight:900;color:var(--gold)}
.notice{margin-top:14px;padding:12px 14px;border-radius:12px;background:#2f2815;color:#ffe3a1}
.tie-box{margin-top:12px;padding:14px;border:1px solid #6f5420;border-radius:14px;background:#15120a}
.tie-box input{width:100px;margin-left:8px;background:#0a0a0a;color:#fff;border:1px solid #444;border-radius:10px;padding:8px}
.hidden{display:none}
@media(max-width:900px){
  .team-grid,.team-grid.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>PM보호국 · 프로젝트 빌런 소탕 작전</h1>
  <p>고정 라운드 대진 3-2-2 · 각 팀 점수를 입력하고 최종 순위를 확정합니다.</p>
</header>
<main>

<section class="round">
  <div class="round-title">
    <h2>ROUND 1</h2>
    <span>3개 팀 고정 대진</span>
  </div>
  <div class="team-grid">

    <div class="team-card">
      <div class="photo-wrap">
        <img src="https://quizn.show/app/file/thumb/4B52E6CE2BA6C2018570095D3392459A" alt="PM 장군">
      </div>
      <div class="team-body">
        <div class="team-name">PM 장군</div>
        <div class="score-row">
          <label for="team1">점수</label>
          <input id="team1" type="number" min="0" inputmode="numeric" placeholder="0">
        </div>
      </div>
    </div>

    <div class="team-card">
      <div class="photo-wrap">
        <img src="https://quizn.show/app/file/thumb/0ECFB58F5BA4E4F7CEBCEDC53DC99334" alt="IN:SIGHT">
      </div>
      <div class="team-body">
        <div class="team-name">IN:SIGHT</div>
        <div class="score-row">
          <label for="team2">점수</label>
          <input id="team2" type="number" min="0" inputmode="numeric" placeholder="0">
        </div>
      </div>
    </div>

    <div class="team-card">
      <div class="photo-wrap">
        <img src="https://quizn.show/app/file/thumb/66413A29054454FD33E3254D97C8597B" alt="KICA">
      </div>
      <div class="team-body">
        <div class="team-name">KICA</div>
        <div class="score-row">
          <label for="team3">점수</label>
          <input id="team3" type="number" min="0" inputmode="numeric" placeholder="0">
        </div>
      </div>
    </div>

  </div>
</section>

<section class="round">
  <div class="round-title">
    <h2>ROUND 2</h2>
    <span>2개 팀 고정 대진</span>
  </div>
  <div class="team-grid two">
    <div class="team-card">
      <div class="photo-wrap">
        <img src="https://quizn.show/app/file/thumb/43ADA08AC1955D761C3188640F3EB14F" alt="PM Transformers">
      </div>
      <div class="team-body">
        <div class="team-name">PM Transformers</div>
        <div class="score-row">
          <label for="team4">점수</label>
          <input id="team4" type="number" min="0" inputmode="numeric" placeholder="0">
        </div>
      </div>
    </div>
    <div class="team-card">
      <div class="photo-wrap">
        <img src="https://quizn.show/app/file/thumb/17B273513D2C724818468D6C2186E90A" alt="Value Guardians">
      </div>
      <div class="team-body">
        <div class="team-name">Value Guardians</div>
        <div class="score-row">
          <label for="team6">점수</label>
          <input id="team6" type="number" min="0" inputmode="numeric" placeholder="0">
        </div>
      </div>
    </div>
  </div>
</section>

<section class="round">
  <div class="round-title">
    <h2>ROUND 3</h2>
    <span>2개 팀 고정 대진</span>
  </div>
  <div class="team-grid two">
    <div class="team-card">
      <div class="photo-wrap">
        <img src="https://quizn.show/app/file/thumb/C0BABB33A13BFB42E5D7840B837B662E" alt="본선만 가자">
      </div>
      <div class="team-body">
        <div class="team-name">본선만 가자</div>
        <div class="score-row">
          <label for="team5">점수</label>
          <input id="team5" type="number" min="0" inputmode="numeric" placeholder="0">
        </div>
      </div>
    </div>
    <div class="team-card">
      <div class="photo-wrap">
        <img src="https://quizn.show/app/file/thumb/634BF7DFAA75D9A194816ED560FBAF71" alt="붉은대게진사갈비">
      </div>
      <div class="team-body">
        <div class="team-name">붉은대게진사갈비</div>
        <div class="score-row">
          <label for="team7">점수</label>
          <input id="team7" type="number" min="0" inputmode="numeric" placeholder="0">
        </div>
      </div>
    </div>
  </div>
</section>

<div class="actions">
  <button class="primary" onclick="saveScores()">점수 저장 · 순위 확인</button>
  <button class="secondary" onclick="resetScores()">점수 초기화</button>
</div>

<section class="summary">
  <h3>프로젝트 빌런 소탕 결과</h3>
  <table>
    <thead><tr><th>순위</th><th>팀</th><th>본게임 점수</th><th>서든데스</th><th>상태</th></tr></thead>
    <tbody id="resultBody"></tbody>
  </table>
  <div id="tieArea"></div>
</section>
</main>

<script>
const teams = [
  {id:"team1", name:"PM 장군", sudden:null},
  {id:"team2", name:"IN:SIGHT", sudden:null},
  {id:"team3", name:"KICA", sudden:null},
  {id:"team4", name:"PM Transformers", sudden:null},
  {id:"team5", name:"본선만 가자", sudden:null},
  {id:"team6", name:"Value Guardians", sudden:null},
  {id:"team7", name:"붉은대게진사갈비", sudden:null}
];

function saveLocal(){
  const data = teams.map(t => ({
    id:t.id, name:t.name,
    score:document.getElementById(t.id).value,
    sudden:t.sudden
  }));
  localStorage.setItem("pmc-villain-game", JSON.stringify(data));
}
function loadLocal(){
  const saved = JSON.parse(localStorage.getItem("pmc-villain-game") || "null");
  if(!saved) return;
  saved.forEach(s=>{
    const el=document.getElementById(s.id);
    if(el) el.value=s.score ?? "";
    const t=teams.find(x=>x.id===s.id);
    if(t) t.sudden=s.sudden ?? null;
  });
}
function getScore(t){
  const v=document.getElementById(t.id).value;
  return v==="" ? null : Number(v);
}
function saveScores(){
  saveLocal();
  renderResults();
}
function sortedTeams(){
  return [...teams].sort((a,b)=>{
    const as=getScore(a), bs=getScore(b);
    if(bs!==as) return (bs ?? -1)-(as ?? -1);
    const abd=a.sudden ?? -1, bbd=b.sudden ?? -1;
    if(bbd!==abd) return bbd-abd;
    return teams.indexOf(a)-teams.indexOf(b);
  });
}
function tieGroups(){
  const by={};
  teams.forEach(t=>{
    const s=getScore(t);
    if(s===null) return;
    (by[s] ||= []).push(t);
  });
  return Object.values(by).filter(g=>g.length>1);
}
function renderResults(){
  const body=document.getElementById("resultBody");
  body.innerHTML="";
  sortedTeams().forEach((t,i)=>{
    const score=getScore(t);
    const tied=score!==null && teams.filter(x=>getScore(x)===score).length>1;
    const resolved=!tied || t.sudden!==null;
    body.innerHTML += `
      <tr>
        <td class="rank">${score===null?"-":i+1}</td>
        <td>${t.name}</td>
        <td>${score===null?"-":score}</td>
        <td>${t.sudden===null?"-":t.sudden}</td>
        <td>${score===null?"미입력":(tied && !resolved?"동점":"확정")}</td>
      </tr>`;
  });

  const area=document.getElementById("tieArea");
  area.innerHTML="";
  const allEntered=teams.every(t=>getScore(t)!==null);
  if(!allEntered){
    area.innerHTML='<div class="notice">7개 팀 점수를 모두 입력하면 동점 여부를 자동 확인합니다.</div>';
    return;
  }
  const ties=tieGroups();
  if(ties.length===0){
    area.innerHTML='<div class="notice">동점 없음 · 최종 순위 확정</div>';
    return;
  }

  area.innerHTML='<div class="notice">동점 발생 · 해당 팀끼리 10초 서든데스를 진행하세요.</div>';
  ties.forEach((group,gi)=>{
    const box=document.createElement("div");
    box.className="tie-box";
    box.innerHTML=`<strong>서든데스 그룹 ${gi+1}</strong><div style="margin-top:10px" id="tie-${gi}"></div>`;
    area.appendChild(box);
    const row=box.querySelector(`#tie-${gi}`);
    group.forEach(t=>{
      const label=document.createElement("label");
      label.style.marginRight="14px";
      label.innerHTML=`${t.name}<input type="number" min="0" id="sd-${t.id}" value="${t.sudden ?? ""}" placeholder="10초 점수">`;
      row.appendChild(label);
    });
  });
  const btn=document.createElement("button");
  btn.className="primary";
  btn.style.marginTop="12px";
  btn.textContent="서든데스 점수 저장";
  btn.onclick=saveSudden;
  area.appendChild(btn);
}
function saveSudden(){
  tieGroups().forEach(group=>{
    group.forEach(t=>{
      const el=document.getElementById(`sd-${t.id}`);
      if(el) t.sudden = el.value==="" ? null : Number(el.value);
    });
  });
  saveLocal();
  renderResults();

  const unresolved=tieGroups().some(group=>{
    const vals=group.map(t=>t.sudden);
    return vals.some(v=>v===null) || new Set(vals).size<vals.length;
  });
  if(unresolved) alert("서든데스도 동점이거나 미입력입니다. 다시 10초 재경기를 진행하세요.");
}
function resetScores(){
  if(!confirm("모든 점수와 서든데스 기록을 초기화할까요?")) return;
  localStorage.removeItem("pmc-villain-game");
  teams.forEach(t=>t.sudden=null);
  teams.forEach(t=>document.getElementById(t.id).value="");
  renderResults();
}
loadLocal();
renderResults();
</script>
</body>
</html>
