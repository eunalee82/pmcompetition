<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PMC 2026 - 두더지 빌런 소탕 작전</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f4f6f8;color:#17212b}header{background:#0b1f3a;color:white;padding:20px 24px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.12)}header h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#b8c6d8;font-size:14px}main{max-width:1100px;margin:0 auto;padding:24px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 6px 18px rgba(0,0,0,.06)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}@media(max-width:760px){.grid{grid-template-columns:1fr}.grid7{grid-template-columns:repeat(4,1fr)}}input,button{font:inherit;border-radius:12px;border:1px solid #d6dde6;padding:11px 12px}input{background:#fff}button{cursor:pointer;background:#0b1f3a;color:#fff;border:none;font-weight:700}button.secondary{background:#e9eef5;color:#17212b}button.green{background:#0aa65b}button.warn{background:#d97706}button:disabled{opacity:.4;cursor:not-allowed}.team-card{border:1px solid #dbe3ec;border-radius:14px;padding:14px;background:#fafbfd}.team-card h3{margin:0 0 8px;font-size:16px}.score-input{width:100px}.rank-table{width:100%;border-collapse:collapse}.rank-table th,.rank-table td{padding:11px 8px;border-bottom:1px solid #e7edf3;text-align:left}.rank-table th{background:#f7f9fb}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9eef5;font-size:12px;font-weight:700}.badge.tie{background:#fff3cd;color:#7a5600}.big{font-size:28px;font-weight:800}.muted{color:#6d7a88;font-size:14px}.reward-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:760px){.reward-grid{grid-template-columns:repeat(2,1fr)}}.flip{perspective:1000px;height:150px}.flip-inner{width:100%;height:100%;position:relative;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}.flip.flipped .flip-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;backface-visibility:hidden;border:2px solid #17375e}.front{background:#0b1f3a;color:white;font-size:26px}.back{background:white;transform:rotateY(180deg);font-weight:800;font-size:18px}.used .face{opacity:.35;pointer-events:none}.slot{padding:16px 8px;border:2px solid #cad5e2;background:white;color:#17212b;border-radius:14px;font-weight:800}.slot.selected{background:#0aa65b;color:white;border-color:#0aa65b}.slot.used{background:#e7edf3;color:#9aa7b4;border-color:#e7edf3}.hidden{display:none}.notice{padding:12px 14px;border-radius:12px;background:#fff3cd;color:#6d5200;margin-top:10px}.success{padding:12px 14px;border-radius:12px;background:#e8f7ef;color:#15613b;margin-top:10px}.section-title{margin:0 0 14px;font-size:20px}
</style>
</head>
<body>
<header><h1>PM보호국 · 두더지 빌런 소탕 작전</h1><p>7개 팀 경기 → 동점 서든데스 → Day 2 발표순서 & 긴급 보급품 선택</p></header>
<main>
<section class="card"><h2 class="section-title">1. 팀 설정 & 본게임 점수 입력</h2><p class="muted">팀명은 자유롭게 수정할 수 있습니다.</p><div id="teamSetup" class="grid"></div><div class="row" style="margin-top:14px"><button class="green" onclick="saveMainScores()">본게임 점수 저장</button><button class="secondary" onclick="resetAll()">전체 초기화</button></div><div id="mainMsg"></div></section>
<section class="card"><h2 class="section-title">2. 현재 순위</h2><table class="rank-table"><thead><tr><th>순위</th><th>팀</th><th>본게임</th><th>서든데스</th><th>상태</th></tr></thead><tbody id="rankingBody"></tbody></table><div id="tieArea"></div></section>
<section id="rewardSection" class="card hidden"><h2 class="section-title">3. 보상 선택</h2><p class="muted">최종 순위 1위부터 차례대로 진행합니다.</p><div class="card" style="background:#f8fafc;box-shadow:none"><div class="muted">현재 선택 팀</div><div id="currentRewardTeam" class="big">-</div><div id="currentRewardRank" class="badge">-</div></div><h3>Day 2 발표 순서 선택</h3><div id="presentationSlots" class="grid7"></div><h3 style="margin-top:24px">긴급 보급품 카드 선택</h3><div id="snackCards" class="reward-grid"></div><div class="row" style="margin-top:18px"><button id="nextRewardBtn" class="green" onclick="nextRewardTeam()">다음 팀</button></div><div id="rewardMsg"></div></section>
<section id="finalSection" class="card hidden"><h2 class="section-title">4. 최종 결과</h2><table class="rank-table"><thead><tr><th>순위</th><th>팀</th><th>점수</th><th>Day 2 발표</th><th>보급품</th></tr></thead><tbody id="finalBody"></tbody></table></section>
</main>
<script>
const DEFAULT_TEAMS=Array.from({length:7},(_,i)=>({id:i+1,name:`Team ${i+1}`,score:"",sudden:null}));
const DEFAULT_SNACKS=["☕ 커피 쿠폰","🍫 초콜릿","⚡ 에너지음료","🦑 오징어/육포","🌭 소시지","🍪 쿠키/과자","🥜 견과류"];
let state=JSON.parse(localStorage.getItem("pmcMoleGame"))||{teams:DEFAULT_TEAMS,tieResolved:false,rewardIndex:0,presentation:{},snacks:{},snackOrder:[...DEFAULT_SNACKS].sort(()=>Math.random()-.5),snackUsed:[],slotUsed:[]};
const persist=()=>localStorage.setItem("pmcMoleGame",JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function renderTeamSetup(){const w=document.getElementById("teamSetup");w.innerHTML="";state.teams.forEach((t,i)=>{w.innerHTML+=`<div class="team-card"><h3>팀 ${i+1}</h3><div class="row"><input id="name-${i}" value="${esc(t.name)}" placeholder="팀명"><input id="score-${i}" class="score-input" type="number" min="0" value="${t.score}" placeholder="점수"></div></div>`})}
function saveMainScores(){state.teams.forEach((t,i)=>{t.name=document.getElementById(`name-${i}`).value.trim()||`Team ${i+1}`;const v=document.getElementById(`score-${i}`).value;t.score=v===""?"":Number(v)});state.tieResolved=false;persist();renderRanking();document.getElementById("mainMsg").innerHTML='<div class="success">본게임 점수를 저장했습니다.</div>'}
function sortedTeams(){return [...state.teams].sort((a,b)=>{if((b.score||0)!==(a.score||0))return(b.score||0)-(a.score||0);const bs=b.sudden??-1,as=a.sudden??-1;if(bs!==as)return bs-as;return a.id-b.id})}
const allEntered=()=>state.teams.every(t=>t.score!=="");
function detectTies(){const m={};state.teams.forEach(t=>(m[t.score]||(m[t.score]=[])).push(t));return Object.values(m).filter(g=>g.length>1)}
function renderRanking(){const b=document.getElementById("rankingBody");b.innerHTML="";sortedTeams().forEach((t,i)=>{const tie=state.teams.filter(x=>x.score===t.score).length>1;b.innerHTML+=`<tr><td>${i+1}</td><td><strong>${esc(t.name)}</strong></td><td>${t.score===""?"-":t.score}</td><td>${t.sudden==null?"-":t.sudden}</td><td>${tie&&t.sudden==null?'<span class="badge tie">동점</span>':'<span class="badge">확정</span>'}</td></tr>`});const a=document.getElementById("tieArea");a.innerHTML="";if(!allEntered()){a.innerHTML='<div class="notice">7팀 점수를 모두 입력하면 동점 여부를 확인합니다.</div>';document.getElementById("rewardSection").classList.add("hidden");return}const ties=detectTies();if(!ties.length){state.tieResolved=true;persist();a.innerHTML='<div class="success">동점 없음. 최종 순위가 확정되었습니다.</div>';showRewards();return}a.innerHTML='<div class="notice"><strong>동점 발생!</strong> 동점 팀끼리 10초 서든데스를 진행하세요.</div>';ties.forEach((g,gi)=>{const box=document.createElement("div");box.className="card";box.style.boxShadow="none";box.style.marginTop="12px";box.innerHTML=`<strong>서든데스 그룹 ${gi+1}</strong><div class="row" style="margin-top:10px"></div>`;a.appendChild(box);const r=box.querySelector(".row");g.forEach(t=>{r.innerHTML+=`<label>${esc(t.name)}<br><input type="number" min="0" id="sd-${t.id}" value="${t.sudden??""}" placeholder="10초 점수"></label>`})});const btn=document.createElement("button");btn.className="warn";btn.textContent="서든데스 점수 저장";btn.style.marginTop="12px";btn.onclick=saveSudden;a.appendChild(btn);document.getElementById("rewardSection").classList.add("hidden")}
function saveSudden(){const ties=detectTies();ties.forEach(g=>g.forEach(t=>{const e=document.getElementById(`sd-${t.id}`);t.sudden=e.value===""?null:Number(e.value)}));let still=false;ties.forEach(g=>{const v=g.map(t=>t.sudden);if(v.some(x=>x==null)||new Set(v).size<v.length)still=true});state.tieResolved=!still;persist();if(still)alert("서든데스도 동점이거나 미입력입니다. 다시 10초 재경기하세요.");renderRanking();if(!still)showRewards()}
function showRewards(){if(!allEntered()||!state.tieResolved)return;document.getElementById("rewardSection").classList.remove("hidden");renderRewardTurn()}
function renderRewardTurn(){const teams=sortedTeams();if(state.rewardIndex>=teams.length){document.getElementById("rewardSection").classList.add("hidden");renderFinal();return}const t=teams[state.rewardIndex];document.getElementById("currentRewardTeam").textContent=t.name;document.getElementById("currentRewardRank").textContent=`${state.rewardIndex+1}위`;renderSlots(t);renderSnacks(t);checkRewardReady(t)}
function renderSlots(t){const w=document.getElementById("presentationSlots");w.innerHTML="";for(let i=1;i<=7;i++){const b=document.createElement("button");b.className="slot";b.textContent=i;if(state.slotUsed.includes(i))b.classList.add("used");if(state.presentation[t.id]===i)b.classList.add("selected");b.disabled=state.slotUsed.includes(i)&&state.presentation[t.id]!==i;b.onclick=()=>{if(state.presentation[t.id])return;state.presentation[t.id]=i;state.slotUsed.push(i);persist();renderSlots(t);checkRewardReady(t)};w.appendChild(b)}}
function renderSnacks(t){const w=document.getElementById("snackCards");w.innerHTML="";state.snackOrder.forEach((s,i)=>{const d=document.createElement("div");d.className="flip";if(state.snackUsed.includes(i)&&state.snacks[t.id]!==i)d.classList.add("used");if(state.snacks[t.id]===i)d.classList.add("flipped");d.innerHTML=`<div class="flip-inner"><div class="face front"><img src="pm-protection-bureau-card.png" alt="PM보호국" style="width:100%;height:100%;object-fit:contain;border-radius:14px;background:#000"></div><div class="face back">${s}</div></div>`;d.onclick=()=>{if(state.snacks[t.id]!=null||state.snackUsed.includes(i))return;state.snacks[t.id]=i;state.snackUsed.push(i);persist();renderSnacks(t);checkRewardReady(t)};w.appendChild(d)})}
function checkRewardReady(t){const ok=!!state.presentation[t.id]&&state.snacks[t.id]!=null;document.getElementById("nextRewardBtn").disabled=!ok;document.getElementById("rewardMsg").innerHTML=ok?`<div class="success">발표 ${state.presentation[t.id]}번째 · ${state.snackOrder[state.snacks[t.id]]} 확정</div>`:""}
function nextRewardTeam(){const t=sortedTeams()[state.rewardIndex];if(!state.presentation[t.id]||state.snacks[t.id]==null)return alert("발표 순서와 보급품 카드를 모두 선택해 주세요.");state.rewardIndex++;persist();renderRewardTurn()}
function renderFinal(){document.getElementById("finalSection").classList.remove("hidden");const b=document.getElementById("finalBody");b.innerHTML="";sortedTeams().forEach((t,i)=>{b.innerHTML+=`<tr><td>${i+1}</td><td><strong>${esc(t.name)}</strong></td><td>${t.score}${t.sudden!=null?` (SD ${t.sudden})`:""}</td><td>${state.presentation[t.id]?state.presentation[t.id]+"번째":"-"}</td><td>${state.snacks[t.id]!=null?state.snackOrder[state.snacks[t.id]]:"-"}</td></tr>`})}
function resetAll(){if(!confirm("모든 점수와 선택 결과를 초기화할까요?"))return;localStorage.removeItem("pmcMoleGame");location.reload()}
renderTeamSetup();renderRanking();if(state.rewardIndex>=7)renderFinal();
</script>
</body>
</html>
